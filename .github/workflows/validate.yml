name: Validate
# Lint, build, and test on every push and pull request. Matches the runtime
# matrix Homebridge Verified expects: Node 20, 22, 24.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
