name: Publish to npm
# Trusted Publishing: npmjs.com trusts this workflow via GitHub OIDC, no token stored.
# Tag a release with `git tag v0.1.1 && git push --tags` to fire.
#
# One-time setup at npmjs.com:
#   1. Go to https://www.npmjs.com/package/homebridge-alexa-sync/access
#   2. Settings → "Publishing access" → Trusted Publisher
#   3. Provider: GitHub Actions
#   4. Organization or user: johnccarroll
#   5. Repository: homebridge-alexa-sync
#   6. Workflow filename: publish.yml
#   7. Environment name: (blank)
#
# After that, this workflow publishes signed packages with provenance on tag push.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for verifying Trusted Publishing setup without a real release.
  # Pick `dry_run: true` from the GitHub UI to authenticate via OIDC and stop
  # before npm registry mutation.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the actual publish (verify OIDC auth only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing + --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
      # Skip if the package.json version is already on npm (idempotent re-tags).
      - name: Check version uniqueness
        id: version-check
        run: |
          local_v=$(node -p "require('./package.json').version")
          published=$(npm view homebridge-alexa-sync@$local_v version 2>/dev/null || echo "")
          if [ "$published" = "$local_v" ]; then
            echo "Version $local_v already on npm. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
